<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>华南大区｜9月品控稽核看板</title>
<style>
:root{--cream:#fbf6ec;--paper:#fff;--ink:#3a2f28;--muted:#88796c;--line:#e7dccb;--red:#9e2b25;--matcha:#6f7d3f;--gold:#c9a66b;--shadow:0 7px 22px rgba(104,76,43,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf6ec,#f1e7d5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.hero{margin:16px auto 18px;padding:25px 30px;border:1px solid rgba(201,166,107,.55);border-bottom:4px solid var(--gold);border-radius:26px;background:linear-gradient(120deg,#f5efe0,#ece0c8);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.brand{font:700 29px/1.3 "Songti SC","STSong",serif;letter-spacing:2px}.brand small{display:block;font:400 13px/1.5 sans-serif;color:#765f49;letter-spacing:1px;margin-top:4px}.pills{display:flex;gap:9px;flex-wrap:wrap}.pill{min-width:88px;padding:7px 12px;border-radius:18px;background:rgba(122,63,42,.08);border:1px solid rgba(122,63,42,.17);text-align:center;font-size:12px;color:#6c5948}.pill b{display:block;color:#a85e3f;font-size:22px}.rule{background:#fffaf0;border:1px solid #ead7b5;border-left:5px solid var(--gold);border-radius:13px;padding:12px 15px;line-height:1.75;font-size:13px;margin-bottom:16px}.filters,.module-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.filters label,.module-tools label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.filters select,.filters button,.module-tools select,.module-tools button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;color:var(--ink);font-size:13px}.filters button,.module-tools button{background:var(--red);color:#fff;border-color:var(--red);cursor:pointer}.section{font:700 18px/1.4 "Songti SC","STSong",serif;color:var(--red);border-left:5px solid var(--gold);padding-left:10px;margin:20px 0 10px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.table-wrap{overflow:auto;max-height:650px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}th{position:sticky;top:0;background:#f3ead9;color:#4a312a;font-weight:800;z-index:2}td.detail{text-align:left;line-height:1.55}td.store{font-weight:700}a{color:var(--matcha);font-weight:700;text-decoration:none}.tag{display:inline-block;padding:2px 8px;border-radius:7px;background:#f3ead9;color:#6c5847;font-size:12px}.tag.offline{background:#eaf0de;color:var(--matcha)}.score{display:inline-block;min-width:52px;border-radius:8px;padding:4px 9px;font-weight:800;background:#f7eedd;color:#8d631d}.score.good{background:#eaf0de;color:var(--matcha)}.status{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:800;white-space:nowrap}.status.done{background:#eaf0de;color:var(--matcha)}.status.miss{background:#f7e4e1;color:var(--red)}.status.none{background:#f3ead9;color:#786858}.report-table{table-layout:fixed;min-width:1210px}.report-table th:nth-child(1){width:8%}.report-table th:nth-child(2){width:15%}.report-table th:nth-child(3),.report-table th:nth-child(6){width:9%}.report-table th:nth-child(4),.report-table th:nth-child(7){width:8%}.report-table th:nth-child(5),.report-table th:nth-child(10){width:9%}.report-table th:nth-child(8){width:8%}.report-table th:nth-child(9){width:9%}.coverage-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}.coverage-summary{font-size:13px;color:#6c5948;line-height:1.8}.coverage-summary b{color:var(--matcha)}.coverage-table{table-layout:fixed;min-width:1040px}.coverage-table th:nth-child(1){width:25%}.coverage-table th:nth-child(2),.coverage-table th:nth-child(3),.coverage-table th:nth-child(4),.coverage-table th:nth-child(5),.coverage-table th:nth-child(6),.coverage-table th:nth-child(7){width:12.5%}.region-row td{background:#f3ead9;color:#4a312a;font-weight:800;text-align:left;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:9px 12px}.region-row .region-stat{margin-left:18px;font-size:12px;font-weight:500;color:#6d5a48}.region-row .region-stat b{color:var(--red)}.issues{table-layout:fixed;min-width:760px}.issues th,.issues td{text-align:left}.issues th:nth-child(1){width:11%}.issues th:nth-child(2){width:18%}.issues th:nth-child(3){width:15%}.issues th:nth-child(4){width:56%}.issue-wrap{overflow-x:auto}.empty{padding:25px;text-align:center;color:var(--muted)}.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:640px){.wrap{padding:10px}.hero{padding:18px 16px;border-radius:20px;margin-top:8px}.brand{font-size:22px}.pills{width:100%;gap:6px}.pill{flex:1;min-width:60px;padding:6px 5px;font-size:10px}.pill b{font-size:18px}.rule{font-size:12px;padding:10px 12px}.filters,.module-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.filters>div,.module-tools>div{min-width:0}.filters select,.module-tools select{width:100%;min-width:0}.filters button,.module-tools button{width:100%}.section{font-size:16px;margin-top:16px}.table-wrap,.issue-wrap{overflow-x:hidden!important;max-height:none}.report-table,.coverage-table,.issues{min-width:0;width:100%;display:block}.report-table thead,.coverage-table thead,.issues thead{display:none}.report-table tbody,.coverage-table tbody,.issues tbody,.redline-mobile tbody{display:block;padding:7px}.report-table tr,.coverage-table tr:not(.region-row),.issues tr,.redline-mobile tr{display:grid;width:100%;margin-bottom:8px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:#fcfaf4}.report-table tr{grid-template-columns:1fr 1fr}.coverage-table tr:not(.region-row){grid-template-columns:1fr 1fr}.issues tr,.redline-mobile tr{grid-template-columns:1fr}.report-table td,.coverage-table td,.issues td,.redline-mobile td{display:flex;justify-content:space-between;gap:8px;width:auto!important;padding:6px 3px;border-bottom:1px dashed var(--line);text-align:right;font-size:11px;min-width:0;line-height:1.45}.report-table td:nth-last-child(-n+2),.coverage-table td:nth-last-child(-n+2){border-bottom:none}.issues td:last-child{border-bottom:none}.report-table td::before,.coverage-table td::before,.issues td::before,.redline-mobile td::before{content:attr(data-label);color:var(--muted);font-weight:600;flex:0 0 auto;text-align:left}.report-table td.store,.coverage-table td.store,.issues td.store{font-weight:800}.report-table td a{white-space:nowrap}.coverage-table .region-row{display:table-row;margin:0;padding:0;border:0}.coverage-table .region-row td{display:table-cell!important;text-align:left!important;border:0;padding:9px 8px;font-size:12px}.coverage-head{align-items:flex-start;padding:10px}.coverage-head select{width:100%}.coverage-summary{width:100%;font-size:11px}.issues td.detail,.redline-mobile td.detail{display:block;text-align:left}.issues td.detail::before,.redline-mobile td.detail::before{display:block;margin-bottom:5px}.redline-mobile table{display:block}.redline-mobile thead{display:none}.empty{padding:20px 10px}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="brand">华南大区<small id="period">9月品控稽核看板</small></div><div class="pills" id="pills"></div></header>
<div class="rule"><b>9月临时审核口径：</b>线下仅纳入“【品控】食安红线与重点检查表”，该表不计算分数；线上沿用“【品控】2026年-线上产品专项稽核表”逻辑，仅展示线上百分制得分。当前不计算或展示门店总分；食安红线仅按报告中明确的红线项统计。</div>
<div class="filters"><div><label>区域</label><select id="region"><option value="">全部区域</option></select></div><div><label>门店</label><select id="store"><option value="">全部门店</option></select></div><button id="reset">重置</button></div>

<div class="section">报告汇总</div>
<div class="panel table-wrap"><table class="report-table"><thead><tr><th>区域</th><th>门店</th><th>线下审核员</th><th>审核日期</th><th>线下报告</th><th>线上审核员</th><th>审核日期</th><th>线上得分</th><th>是否有红线</th><th>线上报告</th></tr></thead><tbody id="reports"></tbody></table></div>

<div class="section">门店稽核覆盖（本月未稽核门店）</div>
<div class="panel"><div class="coverage-head"><div class="coverage-summary" id="coverageSummary"></div><select id="auditStatus"><option value="">全部状态</option><option value="已稽核">已稽核</option><option value="未稽核">未稽核</option></select></div><div class="table-wrap"><table class="coverage-table"><thead><tr><th>门店</th><th>线下</th><th>线下审核员</th><th>线下审核时间</th><th>线上</th><th>线上审核员</th><th>线上审核时间</th></tr></thead><tbody id="coverage"></tbody></table></div></div>

<div class="section">⭐️ 食安红线</div><div class="panel" id="redlines"></div>

<div class="section">问题点明细</div>
<div class="module-tools"><div><label>区域</label><select id="issueRegion"><option value="">全部区域</option></select></div><div><label>门店</label><select id="issueStore"><option value="">全部门店</option></select></div><div><label>报告类型</label><select id="issueReport"><option value="">全部报告类型</option></select></div><button id="issueReset">重置</button></div>
<div class="panel table-wrap issue-wrap"><table class="issues"><thead><tr><th>区域</th><th>门店</th><th>报告类型</th><th>评论详情</th></tr></thead><tbody id="issues"></tbody></table></div>
<div class="foot">数据来源：巡店系统 · 按巡店日统计 · 9月临时规则独立看板</div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA,ORG=[],ORDER={},REPORTS={};
const f={region:document.querySelector('#region'),store:document.querySelector('#store')};
const auditStatus=document.querySelector('#auditStatus');
const issueF={region:document.querySelector('#issueRegion'),store:document.querySelector('#issueStore'),report:document.querySelector('#issueReport')};
function unique(v){return [...new Set(v)]}
function options(el,values,label){el.innerHTML='<option value="">'+label+'</option>'+unique(values).map(x=>`<option>${esc(x)}</option>`).join('')}
function byStore(a,b){return(ORDER[a.store]??9999)-(ORDER[b.store]??9999)||a.store.localeCompare(b.store,'zh-CN')}
function dateShort(x){return x?x.slice(5,10):'—'}
function storeReports(store){const list=DATA.reports.filter(x=>x.store===store).sort((a,b)=>a.checked_at.localeCompare(b.checked_at));return{offline:list.find(x=>x.channel==='线下'),online:list.find(x=>x.channel==='线上')}}
function redlineText(store){const rows=DATA.redlines.filter(x=>x.store===store);if(!rows.length)return'否';const channels=unique(rows.map(x=>x.channel));return'是/'+channels.join('、')}
function statusTag(done){return`<span class="status ${done?'done':'miss'}">${done?'已稽核':'未稽核'}</span>`}
function render(){
 const stores=ORG.filter(x=>(!f.region.value||x.region===f.region.value)&&(!f.store.value||x.store===f.store.value)&&DATA.reports.some(r=>r.store===x.store));
 document.querySelector('#reports').innerHTML=stores.map(x=>{const r=storeReports(x.store),off=r.offline,on=r.online;return`<tr><td data-label="区域">${esc(x.region)}</td><td data-label="门店" class="store">${esc(x.store)}</td><td data-label="线下审核员">${esc(off?.auditor||'—')}</td><td data-label="线下审核日期">${dateShort(off?.date)}</td><td data-label="线下报告">${off?`<a target="_blank" href="${off.report_url}">🔗 查看</a>`:'—'}</td><td data-label="线上审核员">${esc(on?.auditor||'—')}</td><td data-label="线上审核日期">${dateShort(on?.date)}</td><td data-label="线上得分">${on?`<span class="score ${on.score>=80?'good':''}">${on.score}</span>`:'—'}</td><td data-label="是否有红线">${redlineText(x.store)}</td><td data-label="线上报告">${on?`<a target="_blank" href="${on.report_url}">🔗 查看</a>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="10" class="empty">无报告</td></tr>';
 renderCoverage();renderRedlines();renderIssues();
}
function renderCoverage(){
 const rows=ORG.map(x=>{const r=storeReports(x.store);return{...x,offline:r.offline,online:r.online,status:r.offline&&r.online?'已稽核':'未稽核'}}).filter(x=>(!f.region.value||x.region===f.region.value)&&(!f.store.value||x.store===f.store.value)&&(!auditStatus.value||x.status===auditStatus.value));
 const offCount=DATA.reports.filter(x=>x.channel==='线下').reduce((s,x)=>s.add(x.store),new Set()).size,onCount=DATA.reports.filter(x=>x.channel==='线上').reduce((s,x)=>s.add(x.store),new Set()).size;
 document.querySelector('#coverageSummary').innerHTML=`共 <b>${ORG.length}</b> 家；线下已稽核 <b>${offCount}</b> 家，未稽核 <b>${ORG.length-offCount}</b> 家；线上已稽核 <b>${onCount}</b> 家，未稽核 <b>${ORG.length-onCount}</b> 家`;
 let html='';for(const region of unique(rows.map(x=>x.region))){const group=rows.filter(x=>x.region===region),offMiss=group.filter(x=>!x.offline).length,onMiss=group.filter(x=>!x.online).length;html+=`<tr class="region-row"><td colspan="7">${esc(region)}<span class="region-stat">线下未稽核 <b>${offMiss}</b> · 线上未稽核 <b>${onMiss}</b></span></td></tr>`;html+=group.map(x=>`<tr><td data-label="门店" class="store">${esc(x.store)}</td><td data-label="线下状态">${statusTag(!!x.offline)}</td><td data-label="线下审核员">${esc(x.offline?.auditor||'—')}</td><td data-label="线下审核日期">${dateShort(x.offline?.date)}</td><td data-label="线上状态">${statusTag(!!x.online)}</td><td data-label="线上审核员">${esc(x.online?.auditor||'—')}</td><td data-label="线上审核日期">${dateShort(x.online?.date)}</td></tr>`).join('')}document.querySelector('#coverage').innerHTML=html||'<tr><td colspan="7" class="empty">当前筛选无门店</td></tr>';
}
function renderRedlines(){const rows=DATA.redlines.filter(x=>(!f.region.value||x.region===f.region.value)&&(!f.store.value||x.store===f.store.value)).sort(byStore);document.querySelector('#redlines').innerHTML=rows.length?`<div class="table-wrap redline-mobile"><table><thead><tr><th>区域</th><th>门店</th><th>类型</th><th>评论详情</th><th>报告</th></tr></thead><tbody>${rows.map(x=>`<tr><td data-label="区域">${esc(x.region)}</td><td data-label="门店" class="store">${esc(x.store)}</td><td data-label="类型">${x.channel}</td><td data-label="评论详情" class="detail">${esc(x.comment)}</td><td data-label="报告"><a target="_blank" href="${x.report_url}">🔗 查看</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">截至当前未发现报告明确标记的食安红线</div>'}
function renderIssues(){const rows=DATA.issues.map(x=>({...x,template:REPORTS[x.report_id]?.template||''})).filter(x=>x.item!=='存在违反食安操作条数'&&(!issueF.region.value||x.region===issueF.region.value)&&(!issueF.store.value||x.store===issueF.store.value)&&(!issueF.report.value||x.template===issueF.report.value)).sort(byStore);document.querySelector('#issues').innerHTML=rows.map(x=>`<tr><td data-label="区域">${esc(x.region)}</td><td data-label="门店" class="store">${esc(x.store)}</td><td data-label="报告类型">${x.channel==='线下'?'线下重点检查':'线上专项'}</td><td data-label="评论详情" class="detail">${esc(x.comment)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">无问题点</td></tr>'}
Promise.all([fetch('data/qc-data.json?v=20260908-mobile6').then(r=>r.json()),fetch('data/org-structure.json?v=20260908-org6').then(r=>r.json())]).then(([d,org])=>{DATA=d;ORG=org.filter(x=>!['佛山万象天地店','广州万象城店·集'].includes(x.store));ORDER=Object.fromEntries(ORG.map((x,i)=>[x.store,i]));const regionMap=Object.fromEntries(ORG.map(x=>[x.store,x.region]));[...DATA.reports,...DATA.issues,...DATA.redlines].forEach(x=>{if(regionMap[x.store])x.region=regionMap[x.store]});REPORTS=Object.fromEntries(DATA.reports.map(x=>[x.report_id,x]));document.querySelector('#period').textContent=`9月品控稽核看板 · ${d.start} ~ ${d.target}`;document.querySelector('#pills').innerHTML=`<div class="pill"><b>${d.stats.reports}</b>报告</div><div class="pill"><b>${d.stats.offline_reports}</b>线下重点检查</div><div class="pill"><b>${d.stats.online_reports}</b>线上稽核</div><div class="pill"><b>${d.stats.issues}</b>问题点</div><div class="pill"><b>${d.stats.redline}</b>食安红线</div>`;const regions=unique(ORG.map(x=>x.region)),stores=ORG.map(x=>x.store);options(f.region,regions,'全部区域');options(f.store,stores,'全部门店');options(issueF.region,regions,'全部区域');options(issueF.store,stores,'全部门店');options(issueF.report,unique(DATA.reports.map(x=>x.template)),'全部报告类型');Object.values(f).forEach(x=>x.addEventListener('change',render));auditStatus.addEventListener('change',renderCoverage);Object.values(issueF).forEach(x=>x.addEventListener('change',renderIssues));document.querySelector('#reset').onclick=()=>{Object.values(f).forEach(x=>x.value='');auditStatus.value='';render()};document.querySelector('#issueReset').onclick=()=>{Object.values(issueF).forEach(x=>x.value='');renderIssues()};render()}).catch(e=>{document.body.innerHTML='<div class="empty">数据加载失败，请刷新页面</div>';console.error(e)});
</script></body></html>
