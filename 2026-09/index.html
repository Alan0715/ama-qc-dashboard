<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>华南大区｜9月品控稽核看板</title>
<style>
:root{--cream:#fbf6ec;--paper:#fff;--ink:#3a2f28;--muted:#88796c;--line:#e7dccb;--red:#9e2b25;--matcha:#6f7d3f;--gold:#c9a66b;--shadow:0 7px 22px rgba(104,76,43,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf6ec,#f1e7d5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.hero{margin:16px auto 18px;padding:25px 30px;border:1px solid rgba(201,166,107,.55);border-bottom:4px solid var(--gold);border-radius:26px;background:linear-gradient(120deg,#f5efe0,#ece0c8);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.brand{font:700 29px/1.3 "Songti SC","STSong",serif;letter-spacing:2px}.brand small{display:block;font:400 13px/1.5 sans-serif;color:#765f49;letter-spacing:1px;margin-top:4px}.pills{display:flex;gap:9px;flex-wrap:wrap}.pill{min-width:88px;padding:7px 12px;border-radius:18px;background:rgba(122,63,42,.08);border:1px solid rgba(122,63,42,.17);text-align:center;font-size:12px;color:#6c5948}.pill b{display:block;color:#a85e3f;font-size:22px}.rule{background:#fffaf0;border:1px solid #ead7b5;border-left:5px solid var(--gold);border-radius:13px;padding:12px 15px;line-height:1.75;font-size:13px;margin-bottom:16px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:15px}.filters label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.filters select,.filters button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 11px;color:var(--ink);font-size:14px}.filters button{background:var(--red);color:#fff;border-color:var(--red);cursor:pointer}.section{font:700 18px/1.4 "Songti SC","STSong",serif;color:var(--red);border-left:5px solid var(--gold);padding-left:10px;margin:20px 0 10px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.table-wrap{overflow:auto;max-height:620px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:center}th{position:sticky;top:0;background:#f3ead9;color:#4a312a;font-weight:800;z-index:1}td.detail{text-align:left;line-height:1.55;min-width:350px}td.store{font-weight:700;white-space:nowrap}a{color:var(--matcha);font-weight:700;text-decoration:none}a:hover{text-decoration:underline}.score{display:inline-block;min-width:56px;border-radius:8px;padding:4px 9px;font-weight:800;background:#f7eedd;color:#8d631d}.score.good{background:#eaf0de;color:var(--matcha)}.empty{padding:28px;text-align:center;color:var(--muted)}.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px}.tag{display:inline-block;padding:2px 8px;border-radius:7px;background:#f3ead9;color:#6c5847;font-size:12px}.tag.offline{background:#eaf0de;color:var(--matcha)}
@media(max-width:640px){.wrap{padding:10px}.hero{padding:18px 19px;border-radius:21px}.brand{font-size:23px}.pills{width:100%}.pill{flex:1;min-width:70px}table{font-size:10px;table-layout:fixed}.table-wrap{overflow-x:hidden}th,td{padding:6px 4px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}td.detail{min-width:0;text-align:left}.scores th:nth-child(1),.scores td:nth-child(1){width:24%}.scores th:nth-child(2),.scores td:nth-child(2){width:14%}.scores th:nth-child(3),.scores td:nth-child(3){width:18%}.scores th:nth-child(4),.scores td:nth-child(4){width:16%}.scores th:nth-child(5),.scores td:nth-child(5){width:14%}.scores th:nth-child(6),.scores td:nth-child(6){width:14%}.issues th:nth-child(1),.issues td:nth-child(1){width:17%}.issues th:nth-child(2),.issues td:nth-child(2){width:17%}.issues th:nth-child(3),.issues td:nth-child(3){width:12%}.issues th:nth-child(4),.issues td:nth-child(4){width:20%}.issues th:nth-child(5),.issues td:nth-child(5){width:25%}.issues th:nth-child(6),.issues td:nth-child(6){width:9%}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="brand">华南大区<small id="period">9月品控稽核看板</small></div><div class="pills" id="pills"></div></header>
<div class="rule"><b>9月临时审核口径：</b>线下仅纳入“【品控】食安红线与重点检查表”，该表不计算分数；线上沿用“【品控】2026年-线上产品专项稽核表”逻辑，仅展示线上百分制得分。当前不计算或展示门店总分；食安红线仅按报告中明确的红线项统计。</div>
<div class="filters"><div><label>区域</label><select id="region"><option value="">全部区域</option></select></div><div><label>门店</label><select id="store"><option value="">全部门店</option></select></div><div><label>渠道</label><select id="channel"><option value="">全部渠道</option><option>线下</option><option>线上</option></select></div><button id="reset">重置</button></div>
<div class="section">报告汇总</div><div class="panel table-wrap"><table><thead><tr><th>日期</th><th>区域</th><th>门店</th><th>审核员</th><th>报告类型</th><th>审核时间</th><th>线上得分</th><th>报告</th></tr></thead><tbody id="reports"></tbody></table></div>
<div class="section">线上稽核得分</div><div class="panel table-wrap"><table class="scores"><thead><tr><th>门店</th><th>区域</th><th>审核员</th><th>审核日期</th><th>得分</th><th>报告</th></tr></thead><tbody id="scores"></tbody></table></div>
<div class="section">食安红线</div><div class="panel" id="redlines"></div>
<div class="section">问题点明细</div><div class="panel table-wrap"><table class="issues"><thead><tr><th>门店</th><th>区域</th><th>渠道</th><th>检查项</th><th>评论详情</th><th>报告</th></tr></thead><tbody id="issues"></tbody></table></div>
<div class="foot">数据来源：巡店系统 · 按巡店日统计 · 9月临时规则独立看板</div>
</div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let DATA;
const f={region:document.querySelector('#region'),store:document.querySelector('#store'),channel:document.querySelector('#channel')};
function options(el,values,label){el.innerHTML='<option value="">'+label+'</option>'+[...new Set(values)].sort((a,b)=>a.localeCompare(b,'zh-CN')).map(x=>`<option>${esc(x)}</option>`).join('')}
function match(x){return(!f.region.value||x.region===f.region.value)&&(!f.store.value||x.store===f.store.value)&&(!f.channel.value||x.channel===f.channel.value)}
function render(){const reports=DATA.reports.filter(match),issues=DATA.issues.filter(match),online=reports.filter(x=>x.channel==='线上');document.querySelector('#reports').innerHTML=reports.map(x=>`<tr><td>${x.date}</td><td>${esc(x.region)}</td><td class="store">${esc(x.store)}</td><td>${esc(x.auditor)}</td><td><span class="tag ${x.channel==='线下'?'offline':''}">${x.channel==='线下'?'线下重点检查':'线上专项'}</span></td><td>${esc(x.checked_at.slice(11))}</td><td>${x.score==null?'—':x.score}</td><td><a target="_blank" href="${x.report_url}">🔗 查看</a></td></tr>`).join('')||'<tr><td colspan="8" class="empty">无数据</td></tr>';document.querySelector('#scores').innerHTML=online.map(x=>`<tr><td class="store">${esc(x.store)}</td><td>${esc(x.region)}</td><td>${esc(x.auditor)}</td><td>${x.date}</td><td><span class="score ${x.score>=80?'good':''}">${x.score}</span></td><td><a target="_blank" href="${x.report_url}">🔗 查看</a></td></tr>`).join('')||'<tr><td colspan="6" class="empty">无线上报告</td></tr>';const reds=DATA.redlines.filter(match);document.querySelector('#redlines').innerHTML=reds.length?`<div class="table-wrap"><table><thead><tr><th>区域</th><th>门店</th><th>类型</th><th>评论详情</th><th>报告</th></tr></thead><tbody>${reds.map(x=>`<tr><td>${esc(x.region)}</td><td class="store">${esc(x.store)}</td><td>${x.channel}</td><td class="detail">${esc(x.comment)}</td><td><a target="_blank" href="${x.report_url}">🔗 查看</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">截至当前未发现报告明确标记的食安红线</div>';document.querySelector('#issues').innerHTML=issues.map(x=>`<tr><td class="store">${esc(x.store)}</td><td>${esc(x.region)}</td><td>${x.channel}</td><td>${esc(x.item)}</td><td class="detail">${esc(x.comment)}</td><td><a target="_blank" href="${x.report_url}">🔗</a></td></tr>`).join('')||'<tr><td colspan="6" class="empty">无问题点</td></tr>'}
fetch('data/qc-data.json?v=20260907').then(r=>r.json()).then(d=>{DATA=d;document.querySelector('#period').textContent=`9月品控稽核看板 · ${d.start} ~ ${d.target}`;document.querySelector('#pills').innerHTML=`<div class="pill"><b>${d.stats.reports}</b>报告</div><div class="pill"><b>${d.stats.offline_reports}</b>线下重点检查</div><div class="pill"><b>${d.stats.online_reports}</b>线上稽核</div><div class="pill"><b>${d.stats.issues}</b>问题点</div><div class="pill"><b>${d.stats.redline}</b>食安红线</div>`;options(f.region,d.reports.map(x=>x.region),'全部区域');options(f.store,d.reports.map(x=>x.store),'全部门店');Object.values(f).forEach(x=>x.addEventListener('change',render));document.querySelector('#reset').onclick=()=>{Object.values(f).forEach(x=>x.value='');render()};render()}).catch(e=>{document.body.innerHTML='<div class="empty">数据加载失败，请刷新页面</div>';console.error(e)});
</script></body></html>
