<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>华南大区｜9月品控稽核看板</title>
<style>
:root{--cream:#fbf6ec;--paper:#fff;--ink:#3a2f28;--muted:#88796c;--line:#e7dccb;--red:#9e2b25;--matcha:#6f7d3f;--gold:#c9a66b;--shadow:0 7px 22px rgba(104,76,43,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf6ec,#f1e7d5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.hero{margin:16px auto 18px;padding:25px 30px;border:1px solid rgba(201,166,107,.55);border-bottom:4px solid var(--gold);border-radius:26px;background:linear-gradient(120deg,#f5efe0,#ece0c8);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.brand{font:700 29px/1.3 "Songti SC","STSong",serif;letter-spacing:2px}.brand small{display:block;font:400 13px/1.5 sans-serif;color:#765f49;letter-spacing:1px;margin-top:4px}.pills{display:flex;gap:9px;flex-wrap:wrap}.pill{min-width:88px;padding:7px 12px;border-radius:18px;background:rgba(122,63,42,.08);border:1px solid rgba(122,63,42,.17);text-align:center;font-size:12px;color:#6c5948}.pill b{display:block;color:#a85e3f;font-size:22px}.rule{background:#fffaf0;border:1px solid #ead7b5;border-left:5px solid var(--gold);border-radius:13px;padding:12px 15px;line-height:1.75;font-size:13px;margin-bottom:16px}.filters,.module-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.filters label,.module-tools label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.filters select,.filters button,.module-tools select,.module-tools button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;color:var(--ink);font-size:13px}.filters button,.module-tools button{background:var(--red);color:#fff;border-color:var(--red);cursor:pointer}.section{font:700 18px/1.4 "Songti SC","STSong",serif;color:var(--red);border-left:5px solid var(--gold);padding-left:10px;margin:20px 0 10px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.table-wrap{overflow:auto;max-height:620px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:center}th{position:sticky;top:0;background:#f3ead9;color:#4a312a;font-weight:800;z-index:1}td.detail{text-align:left;line-height:1.55;min-width:350px}td.store{font-weight:700}a{color:var(--matcha);font-weight:700;text-decoration:none}.tag{display:inline-block;padding:2px 8px;border-radius:7px;background:#f3ead9;color:#6c5847;font-size:12px}.tag.offline{background:#eaf0de;color:var(--matcha)}.score{display:inline-block;min-width:52px;border-radius:8px;padding:4px 9px;font-weight:800;background:#f7eedd;color:#8d631d}.score.good{background:#eaf0de;color:var(--matcha)}.status{display:inline-block;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:800;white-space:nowrap}.status.done{background:#eaf0de;color:var(--matcha)}.status.miss{background:#f7e4e1;color:var(--red)}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}.score-table th:nth-child(1){width:40%}.score-table th:nth-child(2){width:22%}.score-table th:nth-child(3){width:23%}.score-table th:nth-child(4){width:15%}.coverage-table th:nth-child(1){width:40%}.coverage-table th:nth-child(2){width:22%}.coverage-table th:nth-child(3),.coverage-table th:nth-child(4){width:19%}.issues{table-layout:fixed;min-width:1050px}.issues th:nth-child(1){width:12%}.issues th:nth-child(2){width:20%}.issues th:nth-child(3){width:16%}.issues th:nth-child(4){width:22%}.issues th:nth-child(5){width:30%}.issue-wrap{overflow-x:auto}.mini-card{border:1px solid var(--line);border-radius:11px;background:#fcfaf4;padding:9px 11px;min-width:0}.mini-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}.mini-store{font-weight:800;font-size:13px;line-height:1.35}.mini-region{font-size:11px;color:var(--muted);white-space:nowrap}.mini-meta{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font-size:11px;color:#66584c}.coverage-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}.coverage-summary{font-size:12px;color:#6c5948;line-height:1.7}.coverage-summary b{color:var(--matcha)}.coverage-tools{display:flex;gap:6px}.coverage-tools select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px;color:var(--ink);font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted)}.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:640px){.wrap{padding:10px}.hero{padding:18px 19px;border-radius:21px}.brand{font-size:23px}.pills{width:100%}.pill{flex:1;min-width:70px}.card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px}.score-table,.coverage-table{table-layout:fixed}.issues{min-width:820px;font-size:11px}.issue-wrap{overflow-x:auto!important}.issue-wrap th,.issue-wrap td{padding:7px 8px;word-break:normal;overflow-wrap:break-word}.mini-card{padding:7px}.mini-store{font-size:11px}.mini-region,.mini-meta{font-size:9px}.status{font-size:9px;padding:2px 5px}.coverage-head{align-items:flex-start}.coverage-tools{width:100%}.coverage-tools select{min-width:0;flex:1}table{font-size:9px;table-layout:fixed}.table-wrap{overflow-x:hidden}th,td{padding:6px 3px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.35}td.detail{min-width:0;text-align:left}.reports th:nth-child(1),.reports td:nth-child(1){width:14%}.reports th:nth-child(2),.reports td:nth-child(2){width:12%}.reports th:nth-child(3),.reports td:nth-child(3){width:20%}.reports th:nth-child(4),.reports td:nth-child(4){width:12%}.reports th:nth-child(5),.reports td:nth-child(5){width:16%}.reports th:nth-child(6),.reports td:nth-child(6){width:12%}.reports th:nth-child(7),.reports td:nth-child(7){width:14%}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="brand">华南大区<small id="period">9月品控稽核看板</small></div><div class="pills" id="pills"></div></header>
<div class="rule"><b>9月临时审核口径：</b>线下仅纳入“【品控】食安红线与重点检查表”，该表不计算分数；线上沿用“【品控】2026年-线上产品专项稽核表”逻辑，仅展示线上百分制得分。当前不计算或展示门店总分；食安红线仅按报告中明确的红线项统计。</div>
<div class="filters"><div><label>区域</label><select id="region"><option value="">全部区域</option></select></div><div><label>门店</label><select id="store"><option value="">全部门店</option></select></div><div><label>渠道</label><select id="channel"><option value="">全部渠道</option><option>线下</option><option>线上</option></select></div><button id="reset">重置</button></div>

<div class="section">报告汇总</div>
<div class="panel table-wrap"><table class="reports"><thead><tr><th>日期</th><th>区域</th><th>门店</th><th>审核员</th><th>报告类型</th><th>线上得分</th><th>报告</th></tr></thead><tbody id="reports"></tbody></table></div>

<div class="section">线上稽核得分</div>
<div class="panel table-wrap"><table class="score-table"><thead><tr><th>门店</th><th>区域</th><th>审核员</th><th>得分</th></tr></thead><tbody id="scores"></tbody></table></div>

<div class="section">门店稽核覆盖</div>
<div class="panel"><div class="coverage-head"><div class="coverage-summary" id="coverageSummary"></div><div class="coverage-tools"><select id="offlineStatus"><option value="">线下：全部状态</option><option>已稽核</option><option>未稽核</option></select><select id="onlineStatus"><option value="">线上：全部状态</option><option>已稽核</option><option>未稽核</option></select></div></div><div class="table-wrap"><table class="coverage-table"><thead><tr><th>门店</th><th>区域</th><th>线下重点检查</th><th>线上稽核</th></tr></thead><tbody id="coverage"></tbody></table></div></div>

<div class="section">⭐️ 食安红线</div><div class="panel" id="redlines"></div>

<div class="section">问题点明细</div>
<div class="module-tools"><div><label>区域</label><select id="issueRegion"><option value="">全部区域</option></select></div><div><label>门店</label><select id="issueStore"><option value="">全部门店</option></select></div><div><label>报告类型</label><select id="issueReport"><option value="">全部报告类型</option></select></div><button id="issueReset">重置</button></div>
<div class="panel table-wrap issue-wrap"><table class="issues"><thead><tr><th>区域</th><th>门店</th><th>报告类型</th><th>检查项</th><th>评论详情</th></tr></thead><tbody id="issues"></tbody></table></div>
<div class="foot">数据来源：巡店系统 · 按巡店日统计 · 9月临时规则独立看板</div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA,ORG=[],ORDER={},REPORTS={};
const f={region:document.querySelector('#region'),store:document.querySelector('#store'),channel:document.querySelector('#channel')};
const covF={offline:document.querySelector('#offlineStatus'),online:document.querySelector('#onlineStatus')};
const issueF={region:document.querySelector('#issueRegion'),store:document.querySelector('#issueStore'),report:document.querySelector('#issueReport')};
function orderedUnique(values){return [...new Set(values)]}
function options(el,values,label){el.innerHTML='<option value="">'+label+'</option>'+orderedUnique(values).map(x=>`<option>${esc(x)}</option>`).join('')}
function byStore(a,b){return (ORDER[a.store]??9999)-(ORDER[b.store]??9999)||a.store.localeCompare(b.store,'zh-CN')||(a.checked_at||'').localeCompare(b.checked_at||'')}
function match(x){return(!f.region.value||x.region===f.region.value)&&(!f.store.value||x.store===f.store.value)&&(!f.channel.value||x.channel===f.channel.value)}
function reportLabel(x){return x.channel==='线下'?'线下重点检查':'线上专项'}
function render(){
 const reports=DATA.reports.filter(match).slice().sort(byStore);
 const online=reports.filter(x=>x.channel==='线上');
 const offStores=new Set(DATA.reports.filter(x=>x.channel==='线下').map(x=>x.store));
 const onStores=new Set(DATA.reports.filter(x=>x.channel==='线上').map(x=>x.store));
 const coverage=ORG.map(x=>({...x,offline:offStores.has(x.store)?'已稽核':'未稽核',online:onStores.has(x.store)?'已稽核':'未稽核'})).filter(x=>(!f.region.value||x.region===f.region.value)&&(!f.store.value||x.store===f.store.value)&&(!covF.offline.value||x.offline===covF.offline.value)&&(!covF.online.value||x.online===covF.online.value));
 document.querySelector('#reports').innerHTML=reports.map(x=>`<tr><td>${x.date}</td><td>${esc(x.region)}</td><td class="store">${esc(x.store)}</td><td>${esc(x.auditor)}</td><td><span class="tag ${x.channel==='线下'?'offline':''}">${reportLabel(x)}</span></td><td>${x.score==null?'—':x.score}</td><td><a target="_blank" href="${x.report_url}">🔗 查看</a></td></tr>`).join('')||'<tr><td colspan="7" class="empty">无数据</td></tr>';
 document.querySelector('#scores').innerHTML=online.map(x=>`<tr><td class="store">${esc(x.store)}</td><td>${esc(x.region)}</td><td>${esc(x.auditor)}</td><td><span class="score ${x.score>=80?'good':''}">${x.score}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">无线上报告</td></tr>';
 document.querySelector('#coverageSummary').innerHTML=`线下已稽核 <b>${offStores.size}</b> 家，未稽核 <b>${ORG.length-offStores.size}</b> 家；线上已稽核 <b>${onStores.size}</b> 家，未稽核 <b>${ORG.length-onStores.size}</b> 家`;
 document.querySelector('#coverage').innerHTML=coverage.map(x=>`<tr><td class="store">${esc(x.store)}</td><td>${esc(x.region)}</td><td><span class="status ${x.offline==='已稽核'?'done':'miss'}">${x.offline}</span></td><td><span class="status ${x.online==='已稽核'?'done':'miss'}">${x.online}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">当前筛选无门店</td></tr>';
 const reds=DATA.redlines.filter(match).slice().sort(byStore);
 document.querySelector('#redlines').innerHTML=reds.length?`<div class="table-wrap"><table><thead><tr><th>区域</th><th>门店</th><th>类型</th><th>评论详情</th><th>报告</th></tr></thead><tbody>${reds.map(x=>`<tr><td>${esc(x.region)}</td><td class="store">${esc(x.store)}</td><td>${x.channel}</td><td class="detail">${esc(x.comment)}</td><td><a target="_blank" href="${x.report_url}">🔗 查看</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">截至当前未发现报告明确标记的食安红线</div>';
 renderIssues();
}
function renderIssues(){
 const rows=DATA.issues.map(x=>({...x,template:REPORTS[x.report_id]?.template||''})).filter(x=>(!issueF.region.value||x.region===issueF.region.value)&&(!issueF.store.value||x.store===issueF.store.value)&&(!issueF.report.value||x.template===issueF.report.value)).sort(byStore);
 document.querySelector('#issues').innerHTML=rows.map(x=>`<tr><td>${esc(x.region)}</td><td class="store">${esc(x.store)}</td><td>${x.channel==='线下'?'线下重点检查':'线上专项'}</td><td>${esc(x.item)}</td><td class="detail">${esc(x.comment)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">无问题点</td></tr>';
}
Promise.all([fetch('data/qc-data.json?v=20260908-table3').then(r=>r.json()),fetch('data/org-structure.json?v=20260908-layout2').then(r=>r.json())]).then(([d,org])=>{
 DATA=d;ORG=org.filter(x=>!['佛山万象天地店','广州万象城店·集'].includes(x.store));ORDER=Object.fromEntries(ORG.map((x,i)=>[x.store,i]));const regionMap=Object.fromEntries(ORG.map(x=>[x.store,x.region]));[...DATA.reports,...DATA.issues,...DATA.redlines].forEach(x=>{if(regionMap[x.store])x.region=regionMap[x.store]});REPORTS=Object.fromEntries(DATA.reports.map(x=>[x.report_id,x]));
 document.querySelector('#period').textContent=`9月品控稽核看板 · ${d.start} ~ ${d.target}`;document.querySelector('#pills').innerHTML=`<div class="pill"><b>${d.stats.reports}</b>报告</div><div class="pill"><b>${d.stats.offline_reports}</b>线下重点检查</div><div class="pill"><b>${d.stats.online_reports}</b>线上稽核</div><div class="pill"><b>${d.stats.issues}</b>问题点</div><div class="pill"><b>${d.stats.redline}</b>食安红线</div>`;
 const regions=orderedUnique(ORG.map(x=>x.region));const stores=ORG.map(x=>x.store);options(f.region,regions,'全部区域');options(f.store,stores,'全部门店');options(issueF.region,regions,'全部区域');options(issueF.store,stores,'全部门店');options(issueF.report,orderedUnique(DATA.reports.map(x=>x.template)),'全部报告类型');
 Object.values(f).forEach(x=>x.addEventListener('change',render));Object.values(covF).forEach(x=>x.addEventListener('change',render));Object.values(issueF).forEach(x=>x.addEventListener('change',renderIssues));
 document.querySelector('#reset').onclick=()=>{Object.values(f).forEach(x=>x.value='');Object.values(covF).forEach(x=>x.value='');render()};document.querySelector('#issueReset').onclick=()=>{Object.values(issueF).forEach(x=>x.value='');renderIssues()};render();
}).catch(e=>{document.body.innerHTML='<div class="empty">数据加载失败，请刷新页面</div>';console.error(e)});
</script></body></html>
